name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whitespace and patch integrity
        run: git diff --check HEAD^ HEAD

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Tk (required to import tkinter headlessly)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-tk

      # requirements-dev.txt pins exact versions -> reproducible install (no separate lockfile).
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Validate compilation
        run: python -m py_compile src/gusset_calc.py src/ufm_calc.py src/gusset_app.py

      - name: Build (import smoke test)
        run: python -c "import sys; sys.path.insert(0, 'src'); import gusset_app"

      - name: Run tests
        run: python -m pytest tests -q
